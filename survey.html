<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الراوي الرقمية - تقديم 2026</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; text-align: right; }
        .container { max-width: 700px; background: white; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 3px solid var(--secondary); margin-bottom: 30px; padding-bottom: 15px; }
        .form-section { margin-bottom: 25px; padding: 20px; border: 1px solid #eee; border-radius: 10px; background: #fafafa; }
        label { display: block; font-weight: bold; margin-bottom: 10px; color: var(--primary); }
        input[type="text"], select, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; margin-bottom: 10px; }
        .radio-group { display: flex; gap: 30px; margin: 10px 0; }
        .btn-submit { background-color: var(--secondary); color: white; padding: 18px; border: none; border-radius: 8px; width: 100%; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background-color: #219150; box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="color: var(--primary); margin:0;">منظومة الراوي الرقمية</h2>
        <p style="color: #666;">تسجيل رغبات الطلاب الجدد 2026</p>
    </div>

    <form id="mainSurveyForm">
        <div class="form-section">
            <label>1. اسم الطالب رباعي:</label>
            <input type="text" id="student_name" required>
            
            <label>2. الرقم القومي للطالب (14 رقم):</label>
            <input type="text" id="national_id" maxlength="14" required>

            <label>3. اسم المنطقة السكنية:</label>
            <input type="text" id="residential_area" required>
        </div>

        <div class="form-section">
            <label>4. الرغبة الأولى (أساسية للتوزيع):</label>
            <select id="wish_1" required onchange="assignGroup(this.value)">
                <option value="">-- اختر المدرسة --</option>
                <optgroup label="المجموعة الأولى">
                    <option>العليه ص</option><option>العليه م</option><option>عبده مبروك</option><option>شيبوب ص</option><option>شيبوب م</option><option>الزعيم السادات ص</option><option>الزعيم السادات م</option><option>ابن النفيس ص</option><option>ابن النفيس م</option>
                </optgroup>
                <optgroup label="المجموعة الثانية">
                    <option>السماد</option><option>عاطف السادات</option><option>الرحمانه</option><option>الاصلاح</option><option>حسن بغدادي</option><option>عبد العال ابو الغيط</option><option>متولي الشعراوي</option>
                </optgroup>
                <optgroup label="المجموعة الثالثة">
                    <option>المنشيه البحريه</option><option>العمراوي ص</option><option>العمراوي م</option><option>عطيه الزعيري1 ص</option><option>عطيه الزعيري1 م</option><option>عطيه الزعيري 2 ص</option><option>عطيه الزعيري 2 م</option>
                </optgroup>
                <optgroup label="المجموعة الرابعة">
                    <option>عزيز اباظه ص</option><option>عزيز اباظه م</option><option>الشيماء ص</option><option>الشيماء م</option><option>حسن فتحي ص</option><option>حسن فتحي م</option>
                </optgroup>
                <optgroup label="المجموعة الخامسة">
                    <option>سعد زغلول ص</option><option>سعد زغلول م</option><option>النبوي المهندس ص</option><option>النبوي المهندس م</option><option>النبوي المهندس الجديده</option><option>الزهور 1</option><option>الزهور 2</option><option>فهمي جبر ص</option><option>فهمي جبر م</option><option>المندره القبليه ص</option><option>المندره القبليه م</option>
                </optgroup>
            </select>

            <label>5. الرغبة الثانية:</label>
            <select id="wish_2" required><option value="">-- اختر المدرسة --</option></select>

            <label>6. الرغبة الثالثة:</label>
            <select id="wish_3" required><option value="">-- اختر المدرسة --</option></select>
        </div>

        <div class="form-section">
            <label>7. صورة ولي الأمر (الوجهين):</label>
            <input type="file" required>

            <label>10. صورة إثبات السكن:</label>
            <input type="file" required>
            
            <label>8. هل يوجد أخ/أخت في نفس المدرسة؟</label>
            <div class="radio-group">
                <label><input type="radio" name="siblings" value="نعم"> نعم</label>
                <label><input type="radio" name="siblings" value="لا" checked> لا</label>
            </div>

            <label style="margin-top:15px;">9. هل الطالب مقيد بحضانة (KG2)؟</label>
            <div class="radio-group">
                <label><input type="radio" name="kg2" value="نعم"> نعم</label>
                <label><input type="radio" name="kg2" value="لا" checked> لا</label>
            </div>
        </div>

        <input type="hidden" id="assigned_group">
        <button type="submit" class="btn-submit">إرسال الطلب الآن</button>
    </form>
</div>

<script>
    // 1. نسخ المدارس للرغبات
    window.onload = function() {
        const schools = document.getElementById('wish_1').innerHTML;
        document.getElementById('wish_2').innerHTML = schools;
        document.getElementById('wish_3').innerHTML = schools;
    };

    // 2. إرسال البيانات (ضع الرابط هنا)
    document.getElementById('mainSurveyForm').onsubmit = function(e) {
        e.preventDefault();
        
        // ضع الرابط الذي نسخته من الصورة رقم 7 بدلاً من الكلمة تحت
        const scriptURL = 'الرابط_بتاعك_هنا'; 
        
        const data = {
            name: document.getElementById('student_name').value,
            id: document.getElementById('national_id').value,
            area: document.getElementById('residential_area').value,
            w1: document.getElementById('wish_1').value,
            w2: document.getElementById('wish_2').value,
            w3: document.getElementById('wish_3').value,
            group: document.getElementById('assigned_group').value,
            siblings: document.querySelector('input[name="siblings"]:checked').value,
            kg2: document.querySelector('input[name="kg2"]:checked').value
        };

        fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) })
        .then(() => { alert('تم بنجاح! شكراً لك.'); location.reload(); })
        .catch(() => alert('خطأ في الإرسال!'));
    };

    // 3. تحديد المجموعة
    function assignGroup(school) {
        const g1 = ["العليه ص", "العليه م", "عبده مبروك", "شيبوب ص", "شيبوب م", "الزعيم السادات ص", "الزعيم السادات م", "ابن النفيس ص", "ابن النفيس م"];
        const g2 = ["السماد", "عاطف السادات", "الرحمانه", "الاصلاح", "حسن بغدادي", "عبد العال ابو الغيط", "متولي الشعراوي"];
        const g3 = ["المنشيه البحريه", "العمراوي ص", "العمراوي م", "عطيه الزعيري1 ص", "عطيه الزعيري1 م", "عطيه الزعيري 2 ص", "عطيه الزعيري 2 م"];
        const g4 = ["عزيز اباظه ص", "عزيز اباظه م", "الشيماء ص", "الشيماء م", "حسن فتحي ص", "حسن فتحي م"];
        
        let group = "الخامسة";
        if(g1.includes(school)) group = "الأولى";
        else if(g2.includes(school)) group = "الثانية";
        else if(g3.includes(school)) group = "الثالثة";
        else if(g4.includes(school)) group = "الرابعة";
        document.getElementById('assigned_group').value = group;
    }
</script>
</body>
</html>

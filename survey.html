<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الراوي الرقمية 2026</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 20px; text-align: right; }
        .container { max-width: 600px; background: white; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; }
        .btn-submit { background-color: var(--secondary); color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>منظومة الراوي الرقمية</h2>
    <form id="uploadForm">
        <label>اسم الطالب رباعي:</label>
        <input type="text" id="student_name" required>
        <label>الرقم القومي (14 رقم):</label>
        <input type="text" id="national_id" maxlength="14" required>
        <label>المنطقة:</label>
        <input type="text" id="area" required>
        <label>الرغبة الأولى:</label>
        <select id="wish_1" required>
            <option value="">-- اختر مدرسة --</option>
            <option>العليه ص</option><option>السماد</option><option>العمراوي ص</option>
        </select>
        <hr>
        <label>📷 صورة وجه البطاقة:</label>
        <input type="file" id="front_img" accept="image/*" required>
        <label>📷 صورة ظهر البطاقة:</label>
        <input type="file" id="back_img" accept="image/*" required>
        <label>🏠 صورة إثبات السكن:</label>
        <input type="file" id="house_img" accept="image/*" required>
        
        <button type="submit" class="btn-submit" id="submitBtn">إرسال الطلب</button>
    </form>
</div>

<script>
    // الرابط الجديد اللي أنت بعته
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwKZQEnOTo6WaY0LKmM-NYd7yiQKCvfZhVjhe1h6iU-JEgpeaNGGZ26VQCwtOlb-3X5EA/exec';

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
    });

    document.getElementById('uploadForm').onsubmit = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = "جاري الإرسال...";

        try {
            const data = {
                name: document.getElementById('student_name').value,
                id: document.getElementById('national_id').value,
                area: document.getElementById('area').value,
                w1: document.getElementById('wish_1').value,
                group: "تلقائي",
                frontBase64: await toBase64(document.getElementById('front_img').files[0]),
                frontType: document.getElementById('front_img').files[0].type,
                backBase64: await toBase64(document.getElementById('back_img').files[0]),
                backType: document.getElementById('back_img').files[0].type,
                houseBase64: await toBase64(document.getElementById('house_img').files[0]),
                houseType: document.getElementById('house_img').files[0].type
            };

            await fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) });
            alert('تم استلام طلبك وصورك بنجاح!');
            location.reload();
        } catch (error) {
            alert('حدث خطأ! تأكد من اسم الورقة في الإكسيل Sheet1');
            btn.disabled = false;
        }
    };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الراوي الرقمية 2026</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; text-align: right; }
        .container { max-width: 600px; background: white; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 3px solid var(--secondary); margin-bottom: 30px; padding-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--primary); }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; }
        .btn-submit { background-color: var(--secondary); color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background-color: #219150; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="color: var(--primary); margin:0;">منظومة الراوي الرقمية</h2>
        <p style="color: #666;">تسجيل رغبات الطلاب الجدد 2026</p>
    </div>

    <form id="mainForm">
        <label>اسم الطالب رباعي:</label>
        <input type="text" id="student_name" required>
        
        <label>الرقم القومي للطالب (14 رقم):</label>
        <input type="text" id="national_id" maxlength="14" required>

        <label>المنطقة السكنية:</label>
        <input type="text" id="area" required>

        <label>الرغبة الأولى:</label>
        <select id="wish_1" required onchange="updateGroup(this.value)">
            <option value="">-- اختر مدرسة --</option>
            <option>العليه ص</option>
            <option>السماد</option>
            <option>العمراوي ص</option>
            <option>عزيز اباظه ص</option>
            <option>سعد زغلول ص</option>
        </select>

        <label>الرغبة الثانية:</label>
        <select id="wish_2" required><option value="">-- اختر مدرسة --</option></select>

        <label>الرغبة الثالثة:</label>
        <select id="wish_3" required><option value="">-- اختر مدرسة --</option></select>

        <label>المجموعة (تلقائي):</label>
        <input type="text" id="group" readonly style="background:#eee;">

        <label>وجود إخوة في المدرسة؟</label>
        <select id="siblings"><option>لا</option><option>نعم</option></select>

        <label>هل الطالب مقيد بحضانة KG2؟</label>
        <select id="kg2"><option>لا</option><option>نعم</option></select>

        <button type="submit" class="btn-submit" id="submitBtn">إرسال الطلب الآن</button>
    </form>
</div>

<script>
    // تحديث خيارات المدارس والمجموعة
    window.onload = function() {
        const schools = document.getElementById('wish_1').innerHTML;
        document.getElementById('wish_2').innerHTML = schools;
        document.getElementById('wish_3').innerHTML = schools;
    };

    function updateGroup(val) {
        if(val == "العليه ص") document.getElementById('group').value = "الأولى";
        else if(val == "السماد") document.getElementById('group').value = "الثانية";
        else if(val == "العمراوي ص") document.getElementById('group').value = "الثالثة";
        else document.getElementById('group').value = "أخرى";
    }

    // إرسال البيانات للرابط بتاعك
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwSKOJ1CQ_bcCMR2ZqBGzALCPLHvCP-g1R2VQ7sjTgYgPnj1OATg1fIcSKm81vA05p0Rw/exec';

    document.getElementById('mainForm').onsubmit = function(e) {
        e.preventDefault();
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').innerText = "جاري الإرسال...";

        const formData = {
            name: document.getElementById('student_name').value,
            id: document.getElementById('national_id').value,
            area: document.getElementById('area').value,
            w1: document.getElementById('wish_1').value,
            w2: document.getElementById('wish_2').value,
            w3: document.getElementById('wish_3').value,
            group: document.getElementById('group').value,
            siblings: document.getElementById('siblings').value,
            kg2: document.getElementById('kg2').value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors', // لضمان الإرسال السريع لـ Google
            body: JSON.stringify(formData)
        })
        .then(() => {
            alert('تم استلام طلبك في منظومة الراوي بنجاح!');
            location.reload();
        })
        .catch(error => {
            alert('حدث خطأ، تأكد من اتصال الإنترنت!');
            document.getElementById('submitBtn').disabled = false;
        });
    };
</script>
</body>
</html>

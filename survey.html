<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الراوي الرقمية 2026</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; text-align: right; }
        .container { max-width: 600px; background: white; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 3px solid var(--secondary); margin-bottom: 30px; padding-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--primary); }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; }
        .btn-submit { background-color: var(--secondary); color: white; padding: 15px; border: none; border-radius: 8px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:disabled { background-color: #95a5a6; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="color: var(--primary); margin:0;">منظومة الراوي الرقمية</h2>
        <p style="color: #666;">تسجيل رغبات الطلاب الجدد 2026</p>
    </div>

    <form id="uploadForm">
        <label>اسم الطالب رباعي:</label>
        <input type="text" id="student_name" required>
        
        <label>الرقم القومي للطالب (14 رقم):</label>
        <input type="text" id="national_id" maxlength="14" required>

        <label>المنطقة السكنية:</label>
        <input type="text" id="area" required>

        <label>الرغبة الأولى:</label>
        <select id="wish_1" required onchange="updateGroup(this.value)">
            <option value="">-- اختر مدرسة --</option>
            <option>العليه ص</option><option>السماد</option><option>العمراوي ص</option>
        </select>

        <label>المجموعة (تلقائي):</label>
        <input type="text" id="group" readonly style="background:#eee;">

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <h4 style="color: #c0392b;">المرفقات المطلوبة (صور واضحة):</h4>

        <label>📷 صورة بطاقة ولي الأمر (الوجه):</label>
        <input type="file" id="front_img" accept="image/*" required>

        <label>📷 صورة بطاقة ولي الأمر (الظهر):</label>
        <input type="file" id="back_img" accept="image/*" required>

        <label>🏠 صورة إثبات السكن:</label>
        <input type="file" id="house_img" accept="image/*" required>

        <button type="submit" class="btn-submit" id="submitBtn">إرسال الطلب والمرفقات</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyFHoR16anoeGTjmodwtAXRfpgB7xNxwj2OyWtRZwob6163pcqF1UFdBANCunCXSf9EBQ/exec';

    function updateGroup(val) {
        if(val == "العليه ص") document.getElementById('group').value = "الأولى";
        else if(val == "السماد") document.getElementById('group').value = "الثانية";
        else if(val == "العمراوي ص") document.getElementById('group').value = "الثالثة";
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
    });

    document.getElementById('uploadForm').onsubmit = async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "جاري رفع الصور... انتظر ثواني";

        try {
            const data = {
                name: document.getElementById('student_name').value,
                id: document.getElementById('national_id').value,
                area: document.getElementById('area').value,
                w1: document.getElementById('wish_1').value,
                group: document.getElementById('group').value,
                frontBase64: await toBase64(document.getElementById('front_img').files[0]),
                frontType: document.getElementById('front_img').files[0].type,
                backBase64: await toBase64(document.getElementById('back_img').files[0]),
                backType: document.getElementById('back_img').files[0].type,
                houseBase64: await toBase64(document.getElementById('house_img').files[0]),
                houseType: document.getElementById('house_img').files[0].type
            };

            await fetch(scriptURL, { method: 'POST', body: JSON.stringify(data) });
            alert('تم استلام طلبك بنجاح!');
            location.reload();
        } catch (error) {
            alert('حدث خطأ! تأكد من سرعة الإنترنت');
            btn.disabled = false;
        }
    };
</script>
</body>
</html>

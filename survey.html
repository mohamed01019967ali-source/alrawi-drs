<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة الراوي | تقديم إلكتروني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #f8fafc 0%, #d1d5db 100%); }
        .input-focus:focus { border-color: #1e3a8a; box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white rounded-[2.5rem] shadow-2xl p-8 md:p-12 border-t-[10px] border-blue-900 animate-fadeIn">
        
        <div class="text-center mb-10">
            <h1 class="text-3xl font-[900] text-blue-900 uppercase">منظومة الراوي الرقمية</h1>
            <p class="text-emerald-600 font-bold mt-2">استمارة التقديم الإلكتروني الموحدة</p>
            <div class="h-1 w-24 bg-blue-900 mx-auto mt-4 rounded-full"></div>
        </div>

        <form id="publicSurveyForm" class="space-y-6">
            
            <div class="space-y-4">
                <h3 class="font-bold text-blue-900 border-r-4 border-emerald-500 pr-3">بيانات الطالب</h3>
                <input type="text" id="sName" placeholder="الاسم رباعي من شهادة الميلاد" required 
                       class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none input-focus">
                
                <input type="text" id="sID" placeholder="الرقم القومي للطالب (14 رقم)" required maxlength="14"
                       class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none input-focus font-mono text-center">
            </div>

            <div class="space-y-4">
                <h3 class="font-bold text-blue-900 border-r-4 border-emerald-500 pr-3">بيانات ولي الأمر والتواصل</h3>
                <input type="tel" id="pPhone" placeholder="رقم هاتف ولي الأمر (واتساب)" required 
                       class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none input-focus font-mono">
                
                <input type="text" id="fJob" placeholder="وظيفة الأب / ولي الأمر" required
                       class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none input-focus">
            </div>

            <div class="space-y-4">
                <h3 class="font-bold text-blue-900 border-r-4 border-emerald-500 pr-3">معلومات إضافية</h3>
                <select id="hStatus" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none input-focus">
                    <option value="سليم">الحالة الصحية: سليم</option>
                    <option value="مزمن">يعاني من حالة خاصة</option>
                </select>
                
                <div class="grid grid-cols-2 gap-3">
                    <label class="bg-gray-50 p-3 rounded-xl flex items-center gap-2 cursor-pointer border border-transparent hover:border-blue-900">
                        <input type="checkbox" name="skill" value="رسم" class="accent-blue-900"> رسم
                    </label>
                    <label class="bg-gray-50 p-3 rounded-xl flex items-center gap-2 cursor-pointer border border-transparent hover:border-blue-900">
                        <input type="checkbox" name="skill" value="برمجة" class="accent-blue-900"> برمجة
                    </label>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-900 text-white font-black py-5 rounded-[2rem] shadow-lg hover:bg-emerald-600 transition-all flex justify-center items-center gap-2 group">
                <span id="btnText">إرسال الطلب الآن</span>
                <svg id="arrowIcon" class="w-5 h-5 group-hover:translate-x-[-5px] transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <div id="loader" class="hidden animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div>
            </button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAREfWSSXUefzNBHw5RPhb-TBL3vl3C1Z8",
            authDomain: "al-rawi-drs.firebaseapp.com",
            projectId: "al-rawi-drs",
            storageBucket: "al-rawi-drs.firebasestorage.app",
            messagingSenderId: "1090201098998",
            appId: "1:1090201098998:web:951f39d6e77c855c762ad7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('publicSurveyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const arrow = document.getElementById('arrowIcon');
            const skills = Array.from(document.querySelectorAll('input[name="skill"]:checked')).map(el => el.value);

            btn.disabled = true;
            loader.classList.remove('hidden');
            arrow.classList.add('hidden');

            try {
                await addDoc(collection(db, "responses"), {
                    student_name: document.getElementById('sName').value,
                    national_id: document.getElementById('sID').value,
                    phone: document.getElementById('pPhone').value,
                    father_job: document.getElementById('fJob').value,
                    health: document.getElementById('hStatus').value,
                    skills: skills,
                    status: "Pending", // لازم الموظف يوافق عليه بعدين
                    created_at: new Date()
                });

                // توجيه لصفحة الشكر اللي بتقفل تلقائي
                window.location.href = "thank-you.html";
            } catch (err) {
                alert("حدث خطأ، تأكد من الاتصال بالإنترنت");
                btn.disabled = false;
                loader.classList.add('hidden');
                arrow.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

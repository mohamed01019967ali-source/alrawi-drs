<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة منظومة الراوي الرقمية | DRS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0f172a; overflow-x: hidden; }
        .bg-pattern {
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.1;
        }
        .nav-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .nav-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen text-white relative flex items-center justify-center p-6">
    <div class="absolute inset-0 bg-pattern"></div>

    <div class="max-w-6xl w-full z-10">
        <header class="text-center mb-16">
            <div class="inline-block p-4 rounded-full bg-blue-600/20 mb-6 border border-blue-500/30 animate-pulse">
                <svg class="w-12 h-12 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <h1 class="text-5xl font-[900] tracking-tighter mb-2">منظومة الراوي الرقمية</h1>
            <p class="text-blue-400 font-bold tracking-[0.3em] uppercase">Digital Al-Rawi System (DRS)</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <a href="survey.html" class="nav-card p-8 rounded-[2rem] text-center">
                <div class="text-4xl mb-4">📝</div>
                <h3 class="text-xl font-bold mb-2">تقديم طالب جديد</h3>
                <p class="text-gray-400 text-sm">خاص بأولياء الأمور لتسجيل البيانات لأول مرة</p>
            </a>

            <button onclick="accessSection('student-affairs.html')" class="nav-card p-8 rounded-[2rem] text-center">
                <div class="text-4xl mb-4">📋</div>
                <h3 class="text-xl font-bold mb-2">شئون الطلبة</h3>
                <p class="text-gray-400 text-sm">مراجعة الطلبات، القبول، وإصدار الـ QR</p>
            </button>

            <a href="online-exam.html" class="nav-card p-8 rounded-[2rem] text-center">
                <div class="text-4xl mb-4">💻</div>
                <h3 class="text-xl font-bold mb-2">الامتحانات الإلكترونية</h3>
                <p class="text-gray-500 text-sm">دخول الطلاب لأداء الاختبارات الدورية</p>
            </a>

            <button onclick="accessSection('attendance.html')" class="nav-card p-8 rounded-[2rem] text-center">
                <div class="text-4xl mb-4">⏱️</div>
                <h3 class="text-xl font-bold mb-2">سجل الحضور اليومي</h3>
                <p class="text-gray-400 text-sm">تسجيل حضور وغياب الطلاب لحظياً</p>
            </button>

            <button onclick="accessSection('book-delivery.html')" class="nav-card p-8 rounded-[2rem] text-center">
                <div class="text-4xl mb-4">📚</div>
                <h3 class="text-xl font-bold mb-2">استلام الكتب</h3>
                <p class="text-gray-400 text-sm">إثبات تسليم الكتب المدرسية للطلاب</p>
            </button>

            <button onclick="accessSection('manager-dashboard.html')" class="nav-card p-8 rounded-[2rem] text-center border-emerald-500/20">
                <div class="text-4xl mb-4">📊</div>
                <h3 class="text-xl font-bold mb-2 text-emerald-400">لوحة الإحصائيات</h3>
                <p class="text-gray-400 text-sm">مراقبة الأداء العام للمنظومة والمديرية</p>
            </button>

        </div>

        <footer class="mt-20 text-center text-gray-500 text-xs">
            <p>جميع الحقوق محفوظة لمنظومة الراوي الرقمية © 2026</p>
            <p class="mt-2">تصميم وبرمجة وحدة التطوير التكنولوجي - إدارة الإسكندرية</p>
        </footer>
    </div>

    <script>
        // نظام حماية بسيط للدخول
        function accessSection(url) {
            const pass = prompt("برجاء إدخال رمز الدخول الموحد للموظفين:");
            // كلمة السر الافتراضية هي 2026، تقدر تغيرها طبعاً
            if (pass === "2026") {
                window.location.href = url;
            } else {
                alert("عفواً، رمز الدخول غير صحيح!");
            }
        }
    </script>
</body>
</html>

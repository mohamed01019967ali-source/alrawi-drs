<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مركز التصحيح الإلكتروني | منظومة DRS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f1f5f9; }
        .glass-panel { background: white; border-radius: 2rem; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .official-text { color: #1e3a8a; line-height: 1.4; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-start mb-10 bg-white p-6 rounded-3xl shadow-sm border-r-8 border-emerald-600">
            <div class="official-text font-bold">
                <p class="text-lg">مديرية التربية والتعليم</p>
                <p class="text-md">إدارة الإسكندرية التعليمية</p>
                <p class="text-sm opacity-80">مدرسة الراوي الابتدائية</p>
            </div>
            <div class="text-center">
                <h1 class="text-3xl font-black text-emerald-600">DRS EXAM</h1>
                <p class="text-[10px] text-gray-400 mt-1">وحدة الرصد الإلكتروني الموحد</p>
            </div>
            <div class="text-left official-text font-bold">
                <p>العام الدراسي: 2026/2025</p>
                <p class="text-emerald-600">المرحلة: الابتدائية</p>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass-panel p-8 border-t-4 border-emerald-500">
                <h3 class="text-xl font-bold mb-6 text-gray-700">رصد درجات الاختبار</h3>
                
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs text-gray-400 mb-2 mr-2">الرقم القومي للطالب (اضغط Enter للبحث)</label>
                        <input type="text" id="searchID" 
                               class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-emerald-500 outline-none transition font-bold text-lg" 
                               placeholder="14 رقم">
                    </div>

                    <div id="gradeForm" class="hidden space-y-5 animate-pulse">
                        <div>
                            <label class="block text-xs text-gray-400 mb-2 mr-2">المادة الدراسية</label>
                            <select id="subject" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl outline-none">
                                <option>اللغة العربية</option>
                                <option>الرياضيات</option>
                                <option>اللغة الإنجليزية</option>
                                <option>العلوم</option>
                                <option>الدراسات الاجتماعية</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs text-gray-400 mb-2 mr-2">الدرجة</label>
                                <input type="number" id="grade" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl text-center font-bold text-xl">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-400 mb-2 mr-2">الدرجة النهائية</label>
                                <input type="number" id="maxGrade" value="100" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-2xl text-center opacity-50">
                            </div>
                        </div>
                        <button onclick="submitGrade()" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-emerald-700 transition active:scale-95">
                            اعتماد وحفظ الدرجة
                        </button>
                    </div>
                </div>
            </div>

            <div class="glass-panel p-8 flex flex-col items-center justify-center min-h-[300px] text-center">
                <div id="studentInfo" class="hidden space-y-4">
                    <div class="w-24 h-24 bg-emerald-100 rounded-full flex items-center justify-center text-3xl mx-auto border-4 border-white shadow-md">👨‍🎓</div>
                    <h2 id="foundName" class="text-2xl font-bold text-gray-800">...</h2>
                    <p class="bg-emerald-100 text-emerald-700 px-4 py-1 rounded-full text-xs font-bold inline-block">حالة الطالب: مقيد بنجاح</p>
                </div>
                <div id="emptyState" class="text-gray-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-20 w-20 mx-auto mb-4 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <p>أدخل الرقم القومي للطالب للبحث عن سجله الرقمي</p>
                </div>
            </div>
        </div>

        <div class="mt-8 text-center">
            <button onclick="alert('جاري تشفير البيانات وإرسال الكشوف لمديرية التربية والتعليم بالأسكندرية...')" 
                    class="bg-blue-900 text-white px-10 py-3 rounded-full font-bold shadow-xl hover:bg-blue-800 transition">
                إرسال النتائج النهائية للمديرية 🏛️
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAREfWSSXUefzNBHw5RPhb-TBL3vl3C1Z8",
            authDomain: "al-rawi-drs.firebaseapp.com",
            projectId: "al-rawi-drs",
            storageBucket: "al-rawi-drs.firebasestorage.app",
            messagingSenderId: "1090201098998",
            appId: "1:1090201098998:web:951f39d6e77c855c762ad7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // محرك البحث المتطور
        document.getElementById('searchID').addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const idValue = e.target.value.trim();
                if (!idValue) return;

                // البحث في مجموعة responses
                const q = query(collection(db, "responses"), where("national_id", "==", idValue));
                const snap = await getDocs(q);

                if (!snap.empty) {
                    snap.forEach(doc => {
                        const data = doc.data();
                        document.getElementById('foundName').innerText = data.student_name;
                        document.getElementById('studentInfo').classList.remove('hidden');
                        document.getElementById('gradeForm').classList.remove('hidden');
                        document.getElementById('gradeForm').classList.remove('animate-pulse');
                        document.getElementById('emptyState').classList.add('hidden');
                    });
                } else {
                    alert("لم يتم العثور على طالب بهذا الرقم! تأكد من القبول أولاً في شئون الطلبة.");
                }
            }
        });

        window.submitGrade = async function() {
            const id = document.getElementById('searchID').value.trim();
            const g = document.getElementById('grade').value;
            const s = document.getElementById('subject').value;

            if(!g) return alert("يرجى إدخال الدرجة");

            await addDoc(collection(db, "grades"), {
                student_id: id,
                subject: s,
                score: parseInt(g),
                date: new Date()
            });

            alert("تم الرصد بنجاح! السجل التراكمي للطالب تحدث الآن.");
            location.reload();
        }
    </script>
</body>
</html>

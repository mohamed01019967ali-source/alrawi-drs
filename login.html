<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منظومة الراوي الرقمية (DRS)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Tajawal', sans-serif; 
            /* خلفية متدرجة تعطي إيحاء بالعمق (3D Effect) */
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* تأثير الزجاج (Glassmorphism) */
        .glass-login {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
            border-top: 4px solid #3b82f6; /* لون هوية DRS الأزرق */
        }

        .input-style {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: 0.3s;
        }

        .input-style:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            outline: none;
        }

        /* أنيميشن بسيط للخلفية */
        .bg-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(#3b82f6, #10b981);
            filter: blur(80px);
            z-index: -1;
            opacity: 0.2;
            animation: move 10s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(50%, 50%); }
        }
    </style>
</head>
<body>

    <div class="bg-circle" style="top: 20%; left: 20%;"></div>
    <div class="bg-circle" style="bottom: 10%; right: 10%; background: #6366f1;"></div>

    <div class="glass-login p-10 rounded-[2rem] w-full max-w-md mx-4 relative overflow-hidden">
        
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-white tracking-tighter mb-2">DRS</h1>
            <p class="text-blue-300 text-sm font-bold">منظومة الراوي الرقمية</p>
            <div class="h-1 w-20 bg-blue-500 mx-auto mt-4 rounded-full"></div>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-gray-300 text-xs font-bold mb-2 mr-1">البريد الإلكتروني المهني</label>
                <input type="email" id="email" required placeholder="admin@drs-edu.gov.eg"
                       class="w-full p-4 rounded-2xl input-style text-sm">
            </div>

            <div>
                <label class="block text-gray-300 text-xs font-bold mb-2 mr-1">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••"
                       class="w-full p-4 rounded-2xl input-style text-sm">
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-2xl transform transition active:scale-95 flex justify-center items-center gap-2">
                <span>دخول للمنظومة</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
            </button>
        </form>
        
        <div id="errorBox" class="mt-6 p-3 bg-red-900/30 border border-red-500/50 rounded-xl text-red-200 text-xs text-center hidden">
            ⚠️ خطأ في بيانات الدخول، برجاء المحاولة مرة أخرى.
        </div>

        <div class="mt-8 text-center">
            <p class="text-gray-500 text-[10px]">جميع الحقوق محفوظة © 2026 - مديرية التربية والتعليم</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAREfWSSXUefzNBHw5RPhb-TBL3vl3C1Z8",
            authDomain: "al-rawi-drs.firebaseapp.com",
            projectId: "al-rawi-drs",
            storageBucket: "al-rawi-drs.firebasestorage.app",
            messagingSenderId: "1090201098998",
            appId: "1:1090201098998:web:951f39d6e77c855c762ad7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const errorBox = document.getElementById('errorBox');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // تفعيل حالة التحميل
            submitBtn.disabled = true;
            submitBtn.innerHTML = "جاري التحقق...";
            errorBox.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // محاولة تسجيل الدخول عبر Firebase
                await signInWithEmailAndPassword(auth, email, password);
                
                // إذا نجح، يتم التوجيه لصفحة الـ Dashboard الرئيسية
                window.location.href = "index.html"; 
                
            } catch (error) {
                // إذا فشل، إظهار رسالة الخطأ
                submitBtn.disabled = false;
                submitBtn.innerHTML = "<span>دخول للمنظومة</span>";
                errorBox.classList.remove('hidden');
                console.error("Login Error:", error.message);
            }
        });
    </script>
</body>
</html>

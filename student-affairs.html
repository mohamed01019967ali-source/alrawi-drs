<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة البيانات المتقدمة | منظومة الراوي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f8fafc; }
        .btn-action { transition: all 0.2s; shadow: sm; }
        .btn-action:hover { transform: translateY(-2px); shadow: md; }
        #qr-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="qr-modal">
        <div class="bg-white p-8 rounded-[2.5rem] max-w-sm w-full text-center border-4 border-blue-900">
            <h3 id="qr-name" class="font-bold text-xl mb-4 text-blue-900"></h3>
            <div id="qrcode" class="flex justify-center mb-6"></div>
            <button onclick="document.getElementById('qr-modal').style.display='none'" class="w-full bg-gray-100 py-3 rounded-xl font-bold">إغلاق</button>
        </div>
    </div>

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col lg:flex-row justify-between items-center mb-8 bg-white p-8 rounded-[2.5rem] shadow-sm border-r-8 border-blue-900">
            <div>
                <h1 class="text-2xl font-black text-blue-900">لوحة التحكم في البيانات</h1>
                <p class="text-sm text-gray-500 mt-1">منظومة الراوي الرقمية - إدارة الملفات الضخمة</p>
            </div>
            
            <div class="flex flex-wrap gap-3 mt-4 lg:mt-0">
                <label class="cursor-pointer bg-blue-50 text-blue-700 px-6 py-3 rounded-2xl font-bold border border-blue-100 hover:bg-blue-100 transition flex items-center gap-2">
                    <span>رفع من Excel ⬆️</span>
                    <input type="file" id="uploadExcel" class="hidden" accept=".xlsx, .xls">
                </label>

                <button onclick="exportToExcel()" class="bg-emerald-50 text-emerald-700 px-6 py-3 rounded-2xl font-bold border border-emerald-100 hover:bg-emerald-100 transition">
                    تحميل كشف Excel ⬇️
                </button>
            </div>
        </header>

        <div class="bg-white rounded-[2.5rem] shadow-sm overflow-hidden border border-gray-100">
            <table class="w-full text-right">
                <thead class="bg-gray-50 text-gray-600">
                    <tr>
                        <th class="p-6">اسم الطالب / الموبايل</th>
                        <th class="p-6 text-center">الرقم القومي</th>
                        <th class="p-6 text-center">الحالة</th>
                        <th class="p-6 text-center">التحكم</th>
                    </tr>
                </thead>
                <tbody id="responsesTable" class="divide-y divide-gray-50"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAREfWSSXUefzNBHw5RPhb-TBL3vl3C1Z8",
            authDomain: "al-rawi-drs.firebaseapp.com",
            projectId: "al-rawi-drs",
            storageBucket: "al-rawi-drs.firebasestorage.app",
            messagingSenderId: "1090201098998",
            appId: "1:1090201098998:web:951f39d6e77c855c762ad7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentStudents = [];

        // 1. عرض البيانات لحظياً
        onSnapshot(collection(db, "responses"), (snap) => {
            const table = document.getElementById('responsesTable');
            table.innerHTML = "";
            currentStudents = [];
            snap.forEach((d) => {
                const item = d.data();
                currentStudents.push(item);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="p-6 font-bold text-gray-800">${item.student_name}<br><span class="text-xs text-blue-500 font-normal">${item.phone || ''}</span></td>
                    <td class="p-6 text-center font-mono text-gray-500">${item.national_id}</td>
                    <td class="p-6 text-center"><span class="px-3 py-1 rounded-lg text-[10px] ${item.status=='Approved'?'bg-green-100 text-green-700':'bg-orange-100 text-orange-700'}">${item.status=='Approved'?'مقبول':'انتظار'}</span></td>
                    <td class="p-6 flex justify-center gap-2">
                        <button onclick="window.showQR('${item.national_id}', '${item.student_name}')" class="bg-black text-white p-2 rounded-lg text-xs">QR</button>
                        <button onclick="window.updateStatus('${d.id}', 'Approved')" class="bg-blue-900 text-white p-2 rounded-lg text-xs">قبول</button>
                    </td>
                `;
                table.appendChild(row);
            });
        });

        // 2. وظيفة الرفع من Excel
        document.getElementById('uploadExcel').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet);

                alert(`جاري رفع ${rows.length} طالب للمنظومة...`);
                
                for(let row of rows) {
                    await addDoc(collection(db, "responses"), {
                        student_name: row["الاسم"] || row["اسم الطالب"],
                        national_id: String(row["الرقم القومي"]),
                        phone: String(row["الموبايل"] || ""),
                        status: "Pending",
                        created_at: new Date()
                    });
                }
                alert("تم استيراد البيانات بنجاح!");
            };
            reader.readAsArrayBuffer(file);
        });

        // 3. وظيفة التصدير لـ Excel
        window.exportToExcel = () => {
            const ws = XLSX.utils.json_to_sheet(currentStudents);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Students");
            XLSX.writeFile(wb, "منظومة_الراوي_كشف_الطلاب.xlsx");
        };

        window.updateStatus = async (id, status) => {
            await updateDoc(doc(db, "responses", id), { status });
        };

        window.showQR = (id, name) => {
            document.getElementById('qr-name').innerText = name;
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: id, width: 150, height: 150 });
            document.getElementById('qr-modal').style.display = 'flex';
        };
    </script>
</body>
</html>

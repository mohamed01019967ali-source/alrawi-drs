<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة المركزية | DRS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f0f2f5; }
        .stat-card { background: white; border-radius: 1.5rem; padding: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.05); transition: transform 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 bg-blue-900 p-8 rounded-[2.5rem] text-white shadow-2xl">
            <div class="text-right">
                <h1 class="text-3xl font-black">منظومة الراوي الرقمية (DRS)</h1>
                <p class="opacity-80 mt-1">لوحة الإحصائيات المركزية للمدير العام</p>
            </div>
            <div class="flex gap-4 mt-4 md:mt-0">
                <div class="bg-white/10 p-4 rounded-2xl text-center backdrop-blur-md">
                    <p class="text-xs">تاريخ اليوم</p>
                    <p id="currentDate" class="font-bold"></p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <div class="stat-card border-r-8 border-blue-500">
                <p class="text-gray-500 text-sm font-bold">إجمالي المتقدمين</p>
                <h2 id="totalStudents" class="text-4xl font-black text-blue-900 mt-2">0</h2>
                <p class="text-xs text-blue-400 mt-2">طالب مسجل في القاعدة</p>
            </div>
            <div class="stat-card border-r-8 border-emerald-500">
                <p class="text-gray-500 text-sm font-bold">الطلاب المقبولين</p>
                <h2 id="approvedStudents" class="text-4xl font-black text-emerald-600 mt-2">0</h2>
                <p class="text-xs text-emerald-400 mt-2">تم اعتماد ملفاتهم</p>
            </div>
            <div class="stat-card border-r-8 border-orange-500">
                <p class="text-gray-500 text-sm font-bold">قيد المراجعة</p>
                <h2 id="pendingStudents" class="text-4xl font-black text-orange-500 mt-2">0</h2>
                <p class="text-xs text-orange-400 mt-2">بانتظار قرار شئون الطلبة</p>
            </div>
            <div class="stat-card border-r-8 border-purple-500">
                <p class="text-gray-500 text-sm font-bold">المتوسط العام</p>
                <h2 class="text-4xl font-black text-purple-600 mt-2">88%</h2>
                <p class="text-xs text-purple-400 mt-2">مستوى التحصيل الدراسي</p>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white p-8 rounded-[2rem] shadow-sm">
                <h3 class="font-bold text-gray-700 mb-6 flex items-center gap-2">
                    <span class="w-3 h-3 bg-blue-600 rounded-full"></span> تحليل حالات القبول
                </h3>
                <canvas id="statusChart" height="200"></canvas>
            </div>
            <div class="bg-white p-8 rounded-[2rem] shadow-sm">
                <h3 class="font-bold text-gray-700 mb-6 flex items-center gap-2">
                    <span class="w-3 h-3 bg-emerald-600 rounded-full"></span> توزيع مهارات الطلاب
                </h3>
                <canvas id="skillsChart" height="200"></canvas>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAREfWSSXUefzNBHw5RPhb-TBL3vl3C1Z8",
            authDomain: "al-rawi-drs.firebaseapp.com",
            projectId: "al-rawi-drs",
            storageBucket: "al-rawi-drs.firebasestorage.app",
            messagingSenderId: "1090201098998",
            appId: "1:1090201098998:web:951f39d6e77c855c762ad7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // تحديث التاريخ
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('ar-EG');

        // جلب البيانات وتحديث اللوحة لحظياً
        onSnapshot(collection(db, "responses"), (snapshot) => {
            let total = snapshot.size;
            let approved = 0;
            let pending = 0;
            let skillsData = { "برمجة": 0, "رسم": 0, "رياضة": 0, "موسيقى": 0 };

            snapshot.forEach((doc) => {
                const data = doc.data();
                if (data.status === 'Approved') approved++;
                else pending++;

                if (data.skills) {
                    data.skills.forEach(skill => { if (skillsData[skill] !== undefined) skillsData[skill]++; });
                }
            });

            // تحديث الأرقام
            document.getElementById('totalStudents').innerText = total;
            document.getElementById('approvedStudents').innerText = approved;
            document.getElementById('pendingStudents').innerText = pending;

            // تحديث الرسوم البيانية
            updateCharts(approved, pending, skillsData);
        });

        let statusChart, skillsChart;

        function updateCharts(approved, pending, skills) {
            const ctx1 = document.getElementById('statusChart').getContext('2d');
            const ctx2 = document.getElementById('skillsChart').getContext('2d');

            if (statusChart) statusChart.destroy();
            if (skillsChart) skillsChart.destroy();

            statusChart = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: ['مقبول', 'قيد الانتظار'],
                    datasets: [{
                        data: [approved, pending],
                        backgroundColor: ['#10b981', '#f59e0b'],
                        borderWidth: 0
                    }]
                }
            });

            skillsChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: Object.keys(skills),
                    datasets: [{
                        label: 'عدد الطلاب',
                        data: Object.values(skills),
                        backgroundColor: '#1e3a8a',
                        borderRadius: 10
                    }]
                },
                options: {
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
    </script>
</body>
</html>
